   外观：玻璃效果 + 背景图
   ========================================================= */
const _IDB = {
  db: null,
  open(){
    if (this.db) return Promise.resolve(this.db);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('kaoyan_wb_img', 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('images')) db.createObjectStore('images');
      };
      req.onsuccess = e => { this.db = e.target.result; resolve(this.db); };
      req.onerror = () => reject(req.error);
    });
  },
  async set(key, val){
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('images', 'readwrite');
      tx.objectStore('images').put(val, key);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  },
  async get(key){
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('images', 'readonly');
      const req = tx.objectStore('images').get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  async del(key){
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('images', 'readwrite');
      tx.objectStore('images').delete(key);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }
};

let _bgUrl = null;
let _focusBgUrl = null;
const _cardImgCache = {};

function applyAppearance(){
  const a = state.appearance || {};
  const root = document.documentElement;

  root.style.setProperty('--glass-alpha', a.glassAlpha ?? 0.75);
  root.style.setProperty('--bg-blur', (a.bgBlur ?? 0) + 'px');
  root.style.setProperty('--bg-dim', a.bgDim ?? 0);
  root.style.setProperty('--card-img-mask', a.cardImgMask ?? 0.65);

  // 全屏背景
  if (_bgUrl){
    root.style.setProperty('--bg-image', `url("${_bgUrl}")`);
    document.body.classList.add('bg-has-image');
  } else {
    root.style.removeProperty('--bg-image');
    document.body.classList.remove('bg-has-image');
  }

  // 专注界面背景
  if (_focusBgUrl){
    root.style.setProperty('--focus-bg-image', `url("${_focusBgUrl}")`);
    document.body.classList.add('focus-has-image');
  } else {
    root.style.removeProperty('--focus-bg-image');
    document.body.classList.remove('focus-has-image');
  }

  root.style.setProperty('--focus-bg-alpha', state.appearance?.focusBgAlpha ?? 0.7);
}

async function loadBg(){
  try {
    // 加载全屏背景
    const bgBlob = await _IDB.get('bg');
    if (bgBlob && bgBlob.size){
      if (_bgUrl) URL.revokeObjectURL(_bgUrl);
      _bgUrl = URL.createObjectURL(bgBlob);
      state.appearance.hasBg = true;
    }

    // 加载专注背景
    const focusBlob = await _IDB.get('focus_bg');
    if (focusBlob && focusBlob.size){
      if (_focusBgUrl) URL.revokeObjectURL(_focusBgUrl);
      _focusBgUrl = URL.createObjectURL(focusBlob);
      state.appearance.hasFocusBg = true;
    }
  } catch(e){}

  applyAppearance();
}

/* 给每张卡片加载并应用自己的背景图 */
async function applyCardImages(){
  const els = document.querySelectorAll('[data-card-key]');
  const mask = state.appearance?.cardImgMask ?? 0.65;

  for (const el of els){
    const key = el.dataset.cardKey;
    let url = _cardImgCache[key];

    if (url === undefined){
      try {
        const blob = await _IDB.get('card_' + key);
        url = (blob && blob.size) ? URL.createObjectURL(blob) : null;
      } catch(e){
        url = null;
      }
      _cardImgCache[key] = url;
    }

    const isGradient = el.dataset.cardType === 'gradient';

    if (url){
      let bgImg;
      if (isGradient){
        bgImg = `linear-gradient(140deg, rgba(91,110,245,0.68) 0%, rgba(124,92,240,0.68) 100%), url("${url}")`;
      } else {
        bgImg = `linear-gradient(rgba(255,255,255,${mask}), rgba(255,255,255,${mask})), url("${url}")`;
      }
      // 用内联 !important 直接压过所有 CSS
      el.style.setProperty('background-image', bgImg, 'important');
      el.style.setProperty('background-size', 'cover', 'important');
      el.style.setProperty('background-position', 'center', 'important');
      el.style.setProperty('background-color', 'transparent', 'important');
      el.style.setProperty('background-repeat', 'no-repeat', 'important');
      el.dataset.hasCardImg = '1';
    } else {
      el.style.removeProperty('background-image');
      el.style.removeProperty('background-size');
      el.style.removeProperty('background-position');
      el.style.removeProperty('background-color');
      el.style.removeProperty('background-repeat');
      delete el.dataset.hasCardImg;
    }
  }
}

/* ============ 长按卡片弹出菜单 ============ */
let _pressTimer = null;
let _pressStartPos = null;
let _pressTarget = null;

function pressStart(e){
  const el = e.target.closest('[data-card-key]');
  if (!el) return;
  // 按钮、输入框上不长按
  if (e.target.closest('button, input, textarea, select, a, [data-no-press]')) return;

  const pt = e.touches ? e.touches[0] : e;
  _pressStartPos = { x: pt.clientX, y: pt.clientY };
  _pressTarget = el;

  if (_pressTimer) clearTimeout(_pressTimer);
  _pressTimer = setTimeout(() => {
    _pressTimer = null;
    const el2 = _pressTarget;
    _pressStartPos = null;
    _pressTarget = null;
    if (el2){
      openCardMenu(el2);
      if (navigator.vibrate) navigator.vibrate(15);
    }
  }, 550);
}

function pressMove(e){
  if (!_pressStartPos) return;
  const pt = e.touches ? e.touches[0] : e;
  const dx = pt.clientX - _pressStartPos.x;
  const dy = pt.clientY - _pressStartPos.y;
  // 移动超过 12px 就取消
  if (dx*dx + dy*dy > 144){
    pressEnd();
  }
}

function pressEnd(){
  if (_pressTimer){ clearTimeout(_pressTimer); _pressTimer = null; }
  _pressStartPos = null;
  _pressTarget = null;
}

document.addEventListener('touchstart', pressStart, { passive:true });
document.addEventListener('touchend', pressEnd);
document.addEventListener('touchcancel', pressEnd);
document.addEventListener('touchmove', pressMove, { passive:true });
document.addEventListener('mousedown', pressStart);
document.addEventListener('mouseup', pressEnd);
document.addEventListener('mouseleave', pressEnd);

// 阻止系统长按菜单干扰
document.addEventListener('contextmenu', e => {
  if (e.target.closest && e.target.closest('[data-card-key]')) e.preventDefault();
});

function compressImage(file, maxSize, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxSize || height > maxSize){
          if (width > height){ height = Math.round(height * maxSize / width); width = maxSize; }
          else { width = Math.round(width * maxSize / height); height = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob(b => b ? resolve(b) : reject(new Error('导出失败')), 'image/jpeg', quality);
      };
      img.onerror = () => reject(new Error('图片加载失败'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('文件读取失败'));
    reader.readAsDataURL(file);
  });
}

/* =========================================================
   壁纸调整编辑器 (支持双指缩放/单指拖动，所见即所得)
   ========================================================= */
let _wpState = {
  src: '', target: '',
  scale: 1, x: 0, y: 0,
  baseW: 1, baseH: 1,
  boxW: 1, boxH: 1
};
let _wpTouch = { startDist: 0, startScale: 1, startX: 0, startY: 0, startTx: 0, startTy: 0 };

function openWallpaperEditor(src, target) {
  closeSheet();

  let editor = $('wallpaper-editor');
  if (!editor) {
    editor = document.createElement('div');
    editor.id = 'wallpaper-editor';
    document.body.appendChild(editor);
  }

  editor.innerHTML = `
    <div class="wp-preview-box" id="wp-preview-box">
      <img class="wp-preview-img" id="wp-preview-img" src="${src}">
    </div>
    <div class="wp-controls">
      <button class="wp-btn cancel" onclick="closeWallpaperEditor()">取消</button>
      <button class="wp-btn confirm" onclick="saveWallpaper()">确定</button>
    </div>
  `;

  editor.classList.add('show');

  // 初始化图片尺寸和位置
  const img = $('wp-preview-img');
  const box = $('wp-preview-box');

  img.onload = () => {
    const boxRect = box.getBoundingClientRect();
    const imgRatio = img.naturalWidth / img.naturalHeight;
    const boxRatio = boxRect.width / boxRect.height;

    // 模拟 background-size: cover
    let w, h;
    if (imgRatio > boxRatio) {
      h = boxRect.height;
      w = h * imgRatio;
    } else {
      w = boxRect.width;
      h = w / imgRatio;
    }

    _wpState = {
      src, target,
      scale: 1, x: 0, y: 0,
      baseW: w, baseH: h,
      boxW: boxRect.width, boxH: boxRect.height
    };

    // 初始宽高设定，初始居中
    img.style.width = w + 'px';
    img.style.height = h + 'px';
    img.style.transform = `translate(calc(-50% + 0px), calc(-50% + 0px)) scale(1)`;

    // 绑定触摸和鼠标手势
    bindWpGestures(box, img);
  };
}

function bindWpGestures(box, img) {
  let isDragging = false;
  let lastX = 0, lastY = 0;
  let initialPinchDist = 0;
  let initialScale = 1;

  // --- 触摸事件（手机） ---
  box.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      isDragging = true;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      isDragging = false;
      initialPinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      initialScale = _wpState.scale;
    }
  }, { passive: false });

  box.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1 && isDragging) {
      const dx = e.touches[0].clientX - lastX;
      const dy = e.touches[0].clientY - lastY;
      _wpState.x += dx;
      _wpState.y += dy;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
      applyWpTransform(img);
    } else if (e.touches.length === 2) {
      const currentDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const factor = currentDist / initialPinchDist;
      _wpState.scale = Math.max(1, Math.min(5, initialScale * factor)); // 限制最小1倍，最大5倍
      applyWpTransform(img);
    }
  }, { passive: false });

  box.addEventListener('touchend', e => {
    if (e.touches.length === 0) isDragging = false;
  });

  // --- 鼠标事件（电脑测试用） ---
  box.addEventListener('mousedown', e => {
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
  });
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    _wpState.x += dx;
    _wpState.y += dy;
    lastX = e.clientX;
    lastY = e.clientY;
    applyWpTransform(img);
  });
  window.addEventListener('mouseup', () => { isDragging = false; });

  box.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.1 : 0.1;
    _wpState.scale = Math.max(1, Math.min(5, _wpState.scale + delta));
    applyWpTransform(img);
  }, { passive: false });
}

function applyWpTransform(img) {
  img.style.transform = `translate(calc(-50% + ${_wpState.x}px), calc(-50% + ${_wpState.y}px)) scale(${_wpState.scale})`;
}

function closeWallpaperEditor() {
  const editor = $('wallpaper-editor');
  if (editor) editor.classList.remove('show');
}

async function saveWallpaper() {
  const img = $('wp-preview-img');
  if (!img) return;

  // 获取目标物理尺寸
  const targetWidth = targetWidthOf(_wpState.target);
  const targetHeight = targetHeightOf(_wpState.target);

  const canvas = document.createElement('canvas');
  canvas.width = targetWidth;
  canvas.height = targetHeight;
  const ctx = canvas.getContext('2d');

  // 计算比例因子：目标画布尺寸 / 预览框尺寸
  const ratioW = targetWidth / _wpState.boxW;
  const ratioH = targetHeight / _wpState.boxH;

  // 转换到目标画布上的尺寸和偏移
  const finalW = _wpState.baseW * _wpState.scale * ratioW;
  const finalH = _wpState.baseH * _wpState.scale * ratioH;
  const finalX = (targetWidth - finalW) / 2 + (_wpState.x * ratioW);
  const finalY = (targetHeight - finalH) / 2 + (_wpState.y * ratioH);

  ctx.drawImage(img, finalX, finalY, finalW, finalH);

  canvas.toBlob(async (blob) => {
    if (!blob) return;
    await _IDB.set(_wpState.target, blob);

    if (_wpState.target === 'bg') {
      if (_bgUrl) URL.revokeObjectURL(_bgUrl);
      _bgUrl = URL.createObjectURL(blob);
      state.appearance.hasBg = true;
    } else if (_wpState.target === 'focus_bg') {
      if (_focusBgUrl) URL.revokeObjectURL(_focusBgUrl);
      _focusBgUrl = URL.createObjectURL(blob);
      state.appearance.hasFocusBg = true;
    } else if (_wpState.target.startsWith('card_')) {
      const key = _wpState.target.replace('card_', '');
      if (_cardImgCache[key]) URL.revokeObjectURL(_cardImgCache[key]);
      _cardImgCache[key] = URL.createObjectURL(blob);
    }

    save();
    applyAppearance();
    applyCardImages();
    closeWallpaperEditor();
    render();
    _showToast('✓ 背景已更新');
  }, 'image/jpeg', 0.88);
}

function targetWidthOf(target) {
  if (target === 'bg' || target === 'focus_bg') return 1080;
  if (target.startsWith('card_home-hero')) return 1080;
  return 800; // 普通卡片
}
function targetHeightOf(target) {
  if (target === 'bg') return 1920;
  if (target === 'focus_bg') return 1920;
  if (target.startsWith('card_home-hero')) return 600;
  return 400; // 普通卡片
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  const s = state.focusSession;
  if (!s) return;

  if (s.status === 'running'){
        // 补偿后台流逝的时间（毫秒级）
    if (s.elapsedMs === undefined) s.elapsedMs = (s.elapsedSec || 0) * 1000;
    const now = Date.now();
    const deltaMs = now - s.lastTickTs;
    if (deltaMs > 0){
      s.elapsedMs += deltaMs;
      s.lastTickTs = now;
      s.elapsedSec = Math.floor(s.elapsedMs / 1000);

      if (s.mode === 'countdown' && s.elapsedSec >= s.totalSec){
        s.elapsedSec = s.totalSec;
        s.elapsedMs = s.totalSec * 1000;
        _finishFocus(true);
        return;
    requestWakeLock();
      }
      save();
    }

    // 强制回到计时界面（防止用户切到别的 App 后回来看到主界面）
    if (!$('focus-overlay')?.classList.contains('show')){
      openFocusOverlay();
      _startTimerLoop();
    }
    _updateTimerUI();
  } else if (s.status === 'paused'){
    // 保持暂停状态，只刷新悬浮条
    updateFocusMiniBar();
    _updateTimerUI();
  }
});

/* =========================================================
   返回键锁定：计时未暂停前不允许退出
   ========================================================= */
window.addEventListener('popstate', (e) => {
  const overlayOn = $('focus-overlay')?.classList.contains('show');
  const s = state.focusSession;

  // 主动退出放行一次
  if (_focusAllowExit){
    _focusAllowExit = false;
    _focusHistoryPushed = false;
    return;
  }

  // overlay 已关闭 → 正常返回，不做处理
  if (!overlayOn) {
    _focusHistoryPushed = false;
    return;
  }

  // overlay 打开中
  if (s && s.status === 'running'){
    // 运行中：禁止退出，重新压回历史
    try { history.pushState({ focus: true }, ''); } catch(err){}
    _focusHistoryPushed = true;
    _showToast('请先暂停或结束计时');
    return;
  }

  if (s && s.status === 'paused'){
    // 暂停中：允许关闭 overlay，进入主界面
    $('focus-overlay').classList.remove('show');
    _focusHistoryPushed = false;
    _focusAllowExit = false;
    updateFocusMiniBar();
    return;
  }

  // session 已经不存在，正常放行
  _focusHistoryPushed = false;
});
/* =========================================================
   自动保存保障机制
   ========================================================= */
// 1. 当 App 切到后台（如锁屏、切到微信）时，强制保存一次

  if (document.hidden) {

  }
});

// 2. 当页面即将被关闭/刷新时，强制保存

});

// 3. 每 1 分钟兜底自动保存一次（防止长时间停留在一个页面）

  save();
}, 60000);

// 4. 初始化时记录初始状态

}, 1000);

let lastTouch = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouch < 300) e.preventDefault();
  lastTouch = now;
}, { passive:false });
